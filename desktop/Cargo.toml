[package]
name = "sked"
version = "0.5.0"
edition = "2024"
description = "VKSIT class schedule for the GNOME desktop"
license = "MIT"
publish = false

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"

[profile.release]
lto = true
strip = true
