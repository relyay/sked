services:
  sked:
    build:
      context: ./server
      args:
        VERSION: ${SKED_VERSION:-dev}
    image: sked-server:${SKED_VERSION:-dev}
    container_name: sked
    restart: unless-stopped
    # Same owner as the host's ./data so snapshots and hand-written overrides
    # stay editable outside the container.
    user: "${SKED_UID:-1000}:${SKED_GID:-1000}"
    ports:
      - "${SKED_PORT:-1984}:1984"
    volumes:
      - ./data:/data
    environment:
      SKED_DEBUG: ${SKED_DEBUG:-}
    healthcheck:
      test: ["CMD", "/skedd", "-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
