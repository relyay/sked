# skedd behind Caddy. Set your domain in Caddyfile, then:
#   podman compose up -d        (after git pull: podman compose up -d --build)
services:
  sked:
    build: ./server
    container_name: sked
    restart: unless-stopped
    # Reachable only through Caddy on the compose network.
    expose:
      - "1984"
    volumes:
      - sked-data:/data
    # No compose healthcheck: podman-compose 1.0.x wraps it in /bin/sh -c and
    # the distroless image has no shell. Docker still uses the Dockerfile's
    # HEALTHCHECK (skedd -healthcheck).

  caddy:
    image: docker.io/library/caddy:2
    container_name: sked-caddy
    restart: unless-stopped
    depends_on:
      - sked
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddy-data:/data
      - caddy-config:/config

volumes:
  # Snapshots and overrides/.
  sked-data:
  # Certificates: keep this volume, or Let's Encrypt rate limits may bite.
  caddy-data:
  caddy-config:
