# Production stack: skedd behind Caddy (HTTPS for lunars.ru).
#   just server && podman compose up -d   (or docker compose)
services:
  sked:
    build:
      context: ./server
      args:
        VERSION: ${SKED_VERSION:-dev}
    image: localhost/sked-server:latest
    container_name: sked
    restart: unless-stopped
    # Reachable only through Caddy on the compose network.
    expose:
      - "1984"
    volumes:
      - sked-data:/data
    environment:
      SKED_DEBUG: ${SKED_DEBUG:-}
    healthcheck:
      test: ["CMD", "/skedd", "-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  caddy:
    image: docker.io/library/caddy:2
    container_name: sked-caddy
    restart: unless-stopped
    depends_on:
      - sked
    ports:
      - "${SKED_HTTP_PORT:-80}:80"
      - "${SKED_HTTPS_PORT:-443}:443"
      - "${SKED_HTTPS_PORT:-443}:443/udp"
    environment:
      SKED_DOMAIN: ${SKED_DOMAIN:-lunars.ru}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddy-data:/data
      - caddy-config:/config

volumes:
  # Snapshots and overrides/ (see README for editing overrides).
  sked-data:
  # Certificates: keep this volume, or Let's Encrypt rate limits may bite.
  caddy-data:
  caddy-config:
